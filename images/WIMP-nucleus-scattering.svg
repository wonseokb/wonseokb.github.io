<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2536"/>
    </marker>
  </defs>

  <!-- incoming WIMP chi -->
  <polyline points="55,238 97,194 140,150" fill="none" stroke="#1b2536" stroke-width="2.4" marker-mid="url(#arw)"/>
  <!-- outgoing WIMP chi -->
  <polyline points="140,150 97,107 55,64" fill="none" stroke="#1b2536" stroke-width="2.4" marker-mid="url(#arw)"/>
  <!-- incoming nucleus N -->
  <polyline points="385,238 343,194 300,150" fill="none" stroke="#1b2536" stroke-width="2.4" marker-mid="url(#arw)"/>
  <!-- outgoing nucleus N (recoil) -->
  <polyline points="300,150 343,107 385,64" fill="none" stroke="#1b2536" stroke-width="2.4" marker-mid="url(#arw)"/>

  <!-- mediator exchange -->
  <line x1="140" y1="150" x2="300" y2="150" stroke="#1b2536" stroke-width="2.4" stroke-dasharray="7 6"/>

  <!-- interaction vertices -->
  <circle cx="140" cy="150" r="3.4" fill="#1b2536"/>
  <circle cx="300" cy="150" r="3.4" fill="#1b2536"/>

  <!-- labels -->
  <text x="40" y="248" font-style="italic" font-size="24" fill="#1b2536" text-anchor="end">&#967;</text>
  <text x="40" y="70"  font-style="italic" font-size="24" fill="#1b2536" text-anchor="end">&#967;</text>
  <text x="400" y="248" font-style="italic" font-size="24" fill="#1b2536">N</text>
  <text x="400" y="70"  font-style="italic" font-size="24" fill="#1b2536">N</text>
  <text x="220" y="140" font-size="13" fill="#5a6472" text-anchor="middle">mediator</text>
</svg>
