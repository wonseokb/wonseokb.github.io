<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="810" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="750" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Four steps from animal sounds to translation — and how far AI has climbed</text><rect x="80" y="120" width="460" height="120" rx="8" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="106" y="174" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">1  Detect and sort the calls</text><text x="106" y="210" font-size="19" fill="#5B9A6B" font-weight="600" text-anchor="start">done for many species</text><circle cx="590" cy="162" r="5" fill="#5B9A6B"/><text x="608" y="169" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Crows: 127,000 calls picked out of tag recordings</text><circle cx="590" cy="206" r="5" fill="#5B9A6B"/><text x="608" y="213" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Dogs: barks sorted by context, breed, sex (~70% at best)</text><line x1="310" y1="244" x2="310" y2="284" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="290" width="460" height="120" rx="8" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="106" y="344" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">2  Find the structure</text><text x="106" y="380" font-size="19" fill="#5B9A6B" font-weight="600" text-anchor="start">done in a few</text><circle cx="590" cy="332" r="5" fill="#5B9A6B"/><text x="608" y="339" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Sperm whales: codas built from rhythm, tempo and vowel-like tones</text><circle cx="590" cy="376" r="5" fill="#5B9A6B"/><text x="608" y="383" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Japanese tits: ‘ABC-D’ means ‘danger, come here’; ‘D-ABC’ does not</text><line x1="310" y1="414" x2="310" y2="454" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="460" width="460" height="120" rx="8" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.6"/><text x="106" y="514" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">3  Link sounds to meaning</text><text x="106" y="550" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">first results</text><circle cx="590" cy="502" r="5" fill="#2F6DB5"/><text x="608" y="509" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Zebra finches sort 11 call types by meaning, not sound</text><circle cx="590" cy="546" r="5" fill="#2F6DB5"/><text x="608" y="553" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Elephants and marmosets use name-like calls; dolphins share an ‘alarm’ whistle</text><line x1="310" y1="584" x2="310" y2="624" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="630" width="460" height="120" rx="8" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.6"/><text x="106" y="684" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">4  Two-way conversation</text><text x="106" y="720" font-size="19" fill="#D9822B" font-weight="600" text-anchor="start">not yet</text><circle cx="590" cy="672" r="5" fill="#D9822B"/><text x="608" y="679" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">No animal has talked back to an AI about something it didn’t already know</text><circle cx="590" cy="716" r="5" fill="#D9822B"/><text x="608" y="723" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">The $500,000+ Coller Dolittle grand prize is still unclaimed</text></svg>