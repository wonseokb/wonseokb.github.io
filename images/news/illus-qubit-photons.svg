<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="590" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="530" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Photons: particles of light racing through channels on a silicon chip</text><rect x="90" y="120" width="860" height="380" rx="14" fill="#EEF1F5" stroke="#2B2F36" stroke-width="1.6"/><text x="110" y="150" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">silicon chip (room temperature)</text><circle cx="140" cy="210" r="9" fill="#FFF3C4" stroke="#D9A23C" stroke-width="1.8"/><circle cx="140" cy="290" r="9" fill="#FFF3C4" stroke="#D9A23C" stroke-width="1.8"/><circle cx="140" cy="370" r="9" fill="#FFF3C4" stroke="#D9A23C" stroke-width="1.8"/><circle cx="140" cy="450" r="9" fill="#FFF3C4" stroke="#D9A23C" stroke-width="1.8"/><text x="120" y="484" font-size="15" fill="#D9A23C" font-weight="600" text-anchor="start">photon sources</text><path d="M150 210 L270.0 210 C300.0 210 300.0 244.0 330.0 244.0 C360.0 244.0 360.0 210 390.0 210 L510 210" fill="none" stroke="#2F6DB5" stroke-width="2.4"/><path d="M150 290 L270.0 290 C300.0 290 300.0 244.0 330.0 244.0 C360.0 244.0 360.0 290 390.0 290 L510 290" fill="none" stroke="#2F6DB5" stroke-width="2.4"/><path d="M150 370 L270.0 370 C300.0 370 300.0 404.0 330.0 404.0 C360.0 404.0 360.0 370 390.0 370 L510 370" fill="none" stroke="#2F6DB5" stroke-width="2.4"/><path d="M150 450 L270.0 450 C300.0 450 300.0 404.0 330.0 404.0 C360.0 404.0 360.0 450 390.0 450 L510 450" fill="none" stroke="#2F6DB5" stroke-width="2.4"/><text x="330" y="170" font-size="15" fill="#2F6DB5" font-weight="600" text-anchor="middle">channels come close → photons can swap paths</text><line x1="510" y1="210" x2="870" y2="210" stroke="#2F6DB5" stroke-width="2.4"/><line x1="510" y1="290" x2="870" y2="290" stroke="#2F6DB5" stroke-width="2.4"/><line x1="510" y1="370" x2="870" y2="370" stroke="#2F6DB5" stroke-width="2.4"/><line x1="510" y1="450" x2="870" y2="450" stroke="#2F6DB5" stroke-width="2.4"/><rect x="570" y="278" width="56" height="24" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.4"/><rect x="570" y="438" width="56" height="24" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.4"/><text x="598" y="488" font-size="15" fill="#D9A23C" font-weight="600" text-anchor="middle">heaters tune the timing</text><ellipse cx="240" cy="210" rx="13" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.4"/><ellipse cx="730" cy="290" rx="13" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.4"/><ellipse cx="390" cy="370" rx="13" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.4"/><ellipse cx="790" cy="450" rx="13" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.4"/><line x1="650" y1="370" x2="710" y2="326" stroke="#D9822B" stroke-width="2" stroke-dasharray="5 4"/><ellipse cx="722" cy="320" rx="11" ry="6" fill="none" stroke="#D9822B" stroke-width="1.6" stroke-dasharray="3 3"/><text x="740" y="324" font-size="15" fill="#D9822B" font-weight="600" text-anchor="start">photon lost</text><path d="M880 194 A16 16 0 0 1 880 226 Z" fill="#2B2F36"/><path d="M880 274 A16 16 0 0 1 880 306 Z" fill="#2B2F36"/><path d="M880 354 A16 16 0 0 1 880 386 Z" fill="#2B2F36"/><path d="M880 434 A16 16 0 0 1 880 466 Z" fill="#2B2F36"/><text x="930" y="484" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="end">detectors (cooled)</text><path d="M950 210 C1040 210 1010 150 1070 150" fill="none" stroke="#5B9A6B" stroke-width="3"/><text x="956" y="136" font-size="15" fill="#5B9A6B" font-weight="600" text-anchor="start">optical fibre → next chip</text><text x="1100" y="210" font-size="20" fill="#2F6DB5" font-weight="600" text-anchor="start">Qubit = one photon</text><text x="1100" y="240" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">which of two channels it is in</text><text x="1100" y="266" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">stands for 0 or 1</text><text x="1100" y="320" font-size="20" fill="#5B9A6B" font-weight="600" text-anchor="start">Easy to build and connect</text><text x="1100" y="350" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">made in ordinary chip factories;</text><text x="1100" y="376" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">chips linked by fibre</text><text x="1100" y="430" font-size="20" fill="#D9822B" font-weight="600" text-anchor="start">Photons get lost</text><text x="1100" y="460" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">and gates work only by chance;</text><text x="1100" y="486" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">no logical qubit yet</text></svg>