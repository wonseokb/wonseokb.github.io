<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="590" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="530" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Trapped ions: single charged atoms floating in a vacuum, steered by lasers</text><rect x="80" y="110" width="900" height="400" rx="18" fill="#FFFFFF" stroke="#7C8591" stroke-width="1.4" stroke-dasharray="8 6"/><text x="100" y="142" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">vacuum chamber</text><rect x="150" y="220" width="760" height="22" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.6"/><rect x="150" y="380" width="760" height="22" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.6"/><text x="530" y="206" font-size="16" fill="#D9A23C" font-weight="600" text-anchor="middle">electrodes: electric fields hold the ions</text><circle cx="210" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="210" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="300" cy="311" r="18" fill="#FBE8D3" stroke="#D9822B" stroke-width="2"/><text x="300" y="317" font-size="18" fill="#D9822B" font-weight="700" text-anchor="middle">+</text><circle cx="390" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="390" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="480" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="480" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="570" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="570" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="660" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="660" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="750" cy="311" r="18" fill="#FBE8D3" stroke="#D9822B" stroke-width="2"/><text x="750" y="317" font-size="18" fill="#D9822B" font-weight="700" text-anchor="middle">+</text><circle cx="840" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="840" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><line x1="230" y1="470" x2="300" y2="329" stroke="#D9534F" stroke-width="3" opacity="0.85"/><circle cx="230" cy="470" r="6" fill="#D9534F"/><line x1="680" y1="470" x2="750" y2="329" stroke="#D9534F" stroke-width="3" opacity="0.85"/><circle cx="680" cy="470" r="6" fill="#D9534F"/><text x="230" y="498" font-size="16" fill="#C0392B" font-weight="600" text-anchor="start">laser pulses flip and link qubits</text><path d="M300 289 Q525.0 249 750 289" fill="none" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="6 5"/><text x="525.0" y="261" font-size="16" fill="#D9822B" font-weight="600" text-anchor="middle">any two ions can be linked — they share one vibration</text><text x="1040" y="150" font-size="20" fill="#2F6DB5" font-weight="600" text-anchor="start">Qubit = one atom with its electron removed</text><text x="1040" y="180" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">two energy levels of the ion are 0 and 1;</text><text x="1040" y="206" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">every ion is identical by nature</text><text x="1040" y="290" font-size="20" fill="#5B9A6B" font-weight="600" text-anchor="start">Most accurate</text><text x="1040" y="320" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">two-qubit gates right 99.92% of the time</text><text x="1040" y="380" font-size="20" fill="#D9822B" font-weight="600" text-anchor="start">Slow, and hard to make long</text><text x="1040" y="410" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">microseconds to milliseconds per gate;</text><text x="1040" y="436" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">long chains get unstable → ~100 ions today</text></svg>