<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" width="1600" height="810" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="810" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="750" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">동물 소리에서 통역까지 네 단계, AI는 어디까지 올라왔나</text><rect x="80" y="120" width="460" height="120" rx="8" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="106" y="174" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">1  소리를 찾아 분류하기</text><text x="106" y="210" font-size="19" fill="#5B9A6B" font-weight="600" text-anchor="start">여러 종에서 해냄</text><circle cx="590" cy="162" r="5" fill="#5B9A6B"/><text x="608" y="169" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">까마귀: 소형 기록계에서 울음 12만 7천 개 검출</text><circle cx="590" cy="206" r="5" fill="#5B9A6B"/><text x="608" y="213" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">개: 짖음을 상황·품종·성별로 분류(최고 약 70%)</text><line x1="310" y1="244" x2="310" y2="284" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="290" width="460" height="120" rx="8" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="106" y="344" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">2  구조 찾기</text><text x="106" y="380" font-size="19" fill="#5B9A6B" font-weight="600" text-anchor="start">몇몇 종에서 해냄</text><circle cx="590" cy="332" r="5" fill="#5B9A6B"/><text x="608" y="339" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">향유고래: 리듬·템포·모음 같은 음색으로 짜인 코다</text><circle cx="590" cy="376" r="5" fill="#5B9A6B"/><text x="608" y="383" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">박새: ‘ABC-D’는 ‘위험, 이리 와’, 순서를 뒤집으면 안 통함</text><line x1="310" y1="414" x2="310" y2="454" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="460" width="460" height="120" rx="8" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.6"/><text x="106" y="514" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">3  소리와 뜻 잇기</text><text x="106" y="550" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">첫 결과들</text><circle cx="590" cy="502" r="5" fill="#2F6DB5"/><text x="608" y="509" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">금화조: 11가지 울음을 소리가 아니라 뜻으로 구분</text><circle cx="590" cy="546" r="5" fill="#2F6DB5"/><text x="608" y="553" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">코끼리·마모셋은 이름 같은 소리, 돌고래는 ‘경고’ 휘파람을 공유</text><line x1="310" y1="584" x2="310" y2="624" stroke="#D5DBE3" stroke-width="2" marker-end="url(#ar)"/><rect x="80" y="630" width="460" height="120" rx="8" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.6"/><text x="106" y="684" font-size="24" fill="#2B2F36" font-weight="600" text-anchor="start">4  양방향 대화</text><text x="106" y="720" font-size="19" fill="#D9822B" font-weight="600" text-anchor="start">아직 못 함</text><circle cx="590" cy="672" r="5" fill="#D9822B"/><text x="608" y="679" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">AI에게 이미 알던 것 이상을 ‘대답’한 동물은 아직 없음</text><circle cx="590" cy="716" r="5" fill="#D9822B"/><text x="608" y="723" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">50만 달러 이상의 콜러 둘리틀 대상은 아직 주인이 없음</text></svg>