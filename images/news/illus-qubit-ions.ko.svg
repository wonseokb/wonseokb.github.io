<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" width="1600" height="590" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="590" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="530" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">이온 트랩: 진공 속에 떠 있는 원자 이온, 레이저로 조작</text><rect x="80" y="110" width="900" height="400" rx="18" fill="#FFFFFF" stroke="#7C8591" stroke-width="1.4" stroke-dasharray="8 6"/><text x="100" y="142" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">진공 용기</text><rect x="150" y="220" width="760" height="22" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.6"/><rect x="150" y="380" width="760" height="22" rx="4" fill="#F3E2B8" stroke="#D9A23C" stroke-width="1.6"/><text x="530" y="206" font-size="16" fill="#D9A23C" font-weight="600" text-anchor="middle">전극: 전기장이 이온을 붙잡음</text><circle cx="210" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="210" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="300" cy="311" r="18" fill="#FBE8D3" stroke="#D9822B" stroke-width="2"/><text x="300" y="317" font-size="18" fill="#D9822B" font-weight="700" text-anchor="middle">+</text><circle cx="390" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="390" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="480" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="480" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="570" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="570" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="660" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="660" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><circle cx="750" cy="311" r="18" fill="#FBE8D3" stroke="#D9822B" stroke-width="2"/><text x="750" y="317" font-size="18" fill="#D9822B" font-weight="700" text-anchor="middle">+</text><circle cx="840" cy="311" r="18" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><text x="840" y="317" font-size="18" fill="#2F6DB5" font-weight="700" text-anchor="middle">+</text><line x1="230" y1="470" x2="300" y2="329" stroke="#D9534F" stroke-width="3" opacity="0.85"/><circle cx="230" cy="470" r="6" fill="#D9534F"/><line x1="680" y1="470" x2="750" y2="329" stroke="#D9534F" stroke-width="3" opacity="0.85"/><circle cx="680" cy="470" r="6" fill="#D9534F"/><text x="230" y="498" font-size="16" fill="#C0392B" font-weight="600" text-anchor="start">레이저 펄스로 큐비트를 뒤집고 연결</text><path d="M300 289 Q525.0 249 750 289" fill="none" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="6 5"/><text x="525.0" y="261" font-size="16" fill="#D9822B" font-weight="600" text-anchor="middle">어느 두 이온이든 연결 가능 — 진동을 함께 나눔</text><text x="1040" y="150" font-size="21" fill="#2F6DB5" font-weight="600" text-anchor="start">큐비트 = 전자 하나를 뗀 원자</text><text x="1040" y="180" font-size="18" fill="#7C8591" font-weight="400" text-anchor="start">이온의 두 에너지 준위가 0과 1</text><text x="1040" y="206" font-size="18" fill="#7C8591" font-weight="400" text-anchor="start">모든 이온은 본래 똑같음</text><text x="1040" y="290" font-size="21" fill="#5B9A6B" font-weight="600" text-anchor="start">가장 정확함</text><text x="1040" y="320" font-size="18" fill="#7C8591" font-weight="400" text-anchor="start">두 큐비트 게이트 정확도 99.92%</text><text x="1040" y="380" font-size="21" fill="#D9822B" font-weight="600" text-anchor="start">느리고, 길게 늘리기 어려움</text><text x="1040" y="410" font-size="18" fill="#7C8591" font-weight="400" text-anchor="start">게이트당 마이크로~밀리초,</text><text x="1040" y="436" font-size="18" fill="#7C8591" font-weight="400" text-anchor="start">사슬이 길면 불안정 → 현재 약 100개</text></svg>