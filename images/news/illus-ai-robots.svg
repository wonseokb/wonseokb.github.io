<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="560" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Where AI-driven robots stand (September 2026)</text><text x="380" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">pilot</text><text x="490" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">limited service</text><text x="600" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">at scale</text><text x="80" y="137" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Warehouse robots</text><rect x="330" y="118" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="118" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="118" width="100" height="24" rx="4" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.2"/><text x="680" y="137" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">Amazon: over 1 million robots; touch-sensing picker (Vulcan) rolling out</text><line x1="80" y1="168" x2="1540" y2="168" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="211" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Farm sprayers</text><rect x="330" y="192" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="192" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="192" width="100" height="24" rx="4" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.2"/><text x="680" y="211" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">Deere See &amp; Spray: 5 million+ acres in 2025, about half the herbicide</text><line x1="80" y1="242" x2="1540" y2="242" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="285" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Robotaxis</text><rect x="330" y="266" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="266" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="266" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="285" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">Waymo ~500,000 paid rides a week in 10+ US cities; Baidu 27 cities; Tesla a few dozen cars</text><line x1="80" y1="316" x2="1540" y2="316" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="359" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Robot dogs</text><rect x="330" y="340" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="340" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="340" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="359" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">~2,000 Spot units; 60+ police bomb squads; inspection and standoffs</text><line x1="80" y1="390" x2="1540" y2="390" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="433" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Military drones</text><rect x="330" y="414" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="414" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="414" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="433" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">Ukraine: AI steers the final approach; a human still picks the target</text><line x1="80" y1="464" x2="1540" y2="464" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="507" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">Humanoids</text><rect x="330" y="488" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="488" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><rect x="550" y="488" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="507" font-size="20" fill="#7C8591" font-weight="400" text-anchor="start">Figure 03 sorts parts at one BMW hall; 4–5 h per charge; Optimus not yet in real use</text><line x1="80" y1="538" x2="1540" y2="538" stroke="#D5DBE3" stroke-width="1"/><rect x="30" y="620" width="755" height="350" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="656" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Already good at</text><rect x="815" y="620" width="755" height="350" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="837" y="656" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Still needs work</text><circle cx="72" cy="721" r="6" fill="#5B9A6B"/><text x="92" y="728" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Repetitive tasks in a structured space (shelves, totes, crop rows)</text><circle cx="72" cy="787" r="6" fill="#5B9A6B"/><text x="92" y="794" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Driving on mapped city streets, with remote helpers on call</text><circle cx="72" cy="853" r="6" fill="#5B9A6B"/><text x="92" y="860" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Seeing: weeds, packages, targets, obstacles</text><circle cx="72" cy="919" r="6" fill="#5B9A6B"/><text x="92" y="926" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Patrol and inspection where people shouldn’t go</text><circle cx="857" cy="721" r="6" fill="#D9822B"/><text x="877" y="728" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Hands: unfamiliar objects, thin or soft parts</text><circle cx="857" cy="787" r="6" fill="#D9822B"/><text x="877" y="794" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Reliability: hours of battery, wrists and forearms that break</text><circle cx="857" cy="853" r="6" fill="#D9822B"/><text x="877" y="860" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Rare situations: school buses, blocked roads, bad weather</text><circle cx="857" cy="919" r="6" fill="#D9822B"/><text x="877" y="926" font-size="22" fill="#2B2F36" font-weight="400" text-anchor="start">Judgement and responsibility: who decides, who is liable</text></svg>