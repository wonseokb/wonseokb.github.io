<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="800" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="320" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Entanglement: two particles share one state, however far apart they fly</text><rect x="760" y="195" width="80" height="60" rx="6" fill="#EEF1F5" stroke="#7C8591" stroke-width="1.4"/><text x="800" y="231" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">source</text><text x="800" y="285" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">makes a pair</text><line x1="750" y1="225" x2="260" y2="225" stroke="#7C8591" stroke-width="1.6" marker-end="url(#ar)"/><line x1="850" y1="225" x2="1340" y2="225" stroke="#7C8591" stroke-width="1.6" marker-end="url(#ar)"/><rect x="506" y="209" width="28" height="32" fill="#FFFFFF"/><path d="M508 239 L518 211 M522 239 L532 211" stroke="#7C8591" stroke-width="1.6"/><rect x="1066" y="209" width="28" height="32" fill="#FFFFFF"/><path d="M1068 239 L1078 211 M1082 239 L1092 211" stroke="#7C8591" stroke-width="1.6"/><text x="520" y="269" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">light-years…</text><text x="1080" y="269" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">…light-years</text><circle cx="220" cy="225" r="30" fill="#FFFFFF" stroke="#5B9A6B" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="210" y1="241" x2="210" y2="209" stroke="#2F6DB5" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arb)"/><line x1="230" y1="209" x2="230" y2="241" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#aro)"/><circle cx="1380" cy="225" r="30" fill="#FFFFFF" stroke="#5B9A6B" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1370" y1="241" x2="1370" y2="209" stroke="#2F6DB5" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arb)"/><line x1="1390" y1="209" x2="1390" y2="241" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#aro)"/><text x="220" y="285" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="middle">particle A</text><text x="1380" y="285" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="middle">particle B</text><text x="220" y="307" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(lab on Earth)</text><text x="1380" y="307" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(lab across the galaxy)</text><path d="M220 185 C420 115 1180 115 1380 185" fill="none" stroke="#5B9A6B" stroke-width="2" stroke-dasharray="6 4"/><text x="800" y="113" font-size="17" fill="#5B9A6B" font-weight="600" text-anchor="middle">entangled: neither has its own ↑ or ↓ yet — only “we will be opposite”</text><rect x="30" y="370" width="700" height="400" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="406" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Measure each pair, many times</text><text x="150" y="461" font-size="15" fill="#7C8591" font-weight="600" text-anchor="end">pair</text><text x="150" y="521" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="end">A</text><text x="150" y="601" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="end">B</text><text x="230" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">1</text><circle cx="230" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="230" y1="529" x2="230" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="230" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="230" y1="581" x2="230" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="290" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">2</text><circle cx="290" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="290" y1="501" x2="290" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="290" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="290" y1="609" x2="290" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="350" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">3</text><circle cx="350" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="350" y1="501" x2="350" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="350" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="350" y1="609" x2="350" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="410" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">4</text><circle cx="410" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="410" y1="529" x2="410" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="410" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="410" y1="581" x2="410" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="470" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">5</text><circle cx="470" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="470" y1="501" x2="470" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="470" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="470" y1="609" x2="470" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="530" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">6</text><circle cx="530" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="530" y1="529" x2="530" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="530" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="530" y1="581" x2="530" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="590" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">7</text><circle cx="590" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="590" y1="529" x2="590" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="590" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="590" y1="581" x2="590" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="650" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">8</text><circle cx="650" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="650" y1="501" x2="650" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="650" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="650" y1="609" x2="650" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="60" y="676" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="start">A alone: random, like a coin (50 : 50)</text><text x="60" y="706" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="start">B alone: random, like a coin (50 : 50)</text><text x="60" y="742" font-size="17" fill="#5B9A6B" font-weight="600" text-anchor="start">Together: always opposite — every single time</text><rect x="750" y="370" width="820" height="400" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="772" y="406" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">What it means — and what it doesn’t</text><text x="786" y="452" font-size="24" fill="#5B9A6B" font-weight="600" text-anchor="middle">✓</text><text x="812" y="452" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">The moment A is measured, B’s result is fixed to match —</text><text x="812" y="480" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">at any distance, with no delay.</text><text x="786" y="534" font-size="24" fill="#C0392B" font-weight="600" text-anchor="middle">✗</text><text x="812" y="534" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">But nothing travels between them, and B alone still looks random:</text><text x="812" y="562" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">no message can be sent this way, nothing beats the speed of light.</text><text x="786" y="616" font-size="24" fill="#C0392B" font-weight="600" text-anchor="middle">✗</text><text x="812" y="616" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">Rotating or kicking A afterwards does not change B; the link shows</text><text x="812" y="644" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">up only when the two lists of results are compared.</text><text x="786" y="698" font-size="24" fill="#5B9A6B" font-weight="600" text-anchor="middle">✓</text><text x="812" y="698" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">Not decided in advance, like a pair of gloves split into two boxes:</text><text x="812" y="726" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">Bell tests rule that out (Nobel Prize in Physics 2022).</text></svg>