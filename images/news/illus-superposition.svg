#2B2F36" font-weight="600" text-anchor="middle">look</text><line x1="1014" y1="325" x2="1108" y2="325" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><text x="1061" y="312" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">again…</text><rect x="30" y="540" width="1540" height="270" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="576" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Energy works the same way: an atom can sit in a blend of its low and high levels</text><line x1="120" y1="640" x2="280" y2="640" stroke="#2B2F36" stroke-width="2.4"/><line x1="120" y1="740" x2="280" y2="740" stroke="#2B2F36" stroke-width="2.4"/><text x="105" y="646" font-size="15" fill="#7C8591" font-weight="400" text-anchor="end">high</text><text x="105" y="746" font-size="15" fill="#7C8591" font-weight="400" text-anchor="end">low</text><circle cx="200.0" cy="624.0" r="12" fill="none" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.75"/><circle cx="200.0" cy="724.0" r="12" fill="none" stroke="#2F6DB5" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.75"/><text x="240" y="630" font-size="16" fill="#2F6DB5" font-weight="600" text-anchor="start">30%</text><text x="240" y="730" font-size="16" fill="#2F6DB5" font-weight="600" text-anchor="start">70%</text><text x="200" y="780" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">before: both at once</text><line x1="320" y1="690" x2="420" y2="690" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><text x="370" y="677" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">look</text><line x1="460" y1="640" x2="600" y2="640" stroke="#2B2F36" stroke-width="2.4"/><line x1="460" y1="740" x2="600" y2="740" stroke="#2B2F36" stroke-width="2.4"/><circle cx="530.0" cy="724.0" r="12" fill="#2F6DB5" stroke="#2B2F36" stroke-width="1.4"/><text x="530" y="780" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">70% of runs</text><line x1="660" y1="640" x2="800" y2="640" stroke="#2B2F36" stroke-width="2.4"/><line x1="660" y1="740" x2="800" y2="740" stroke="#2B2F36" stroke-width="2.4"/><circle cx="730.0" cy="624.0" r="12" fill="#2F6DB5" stroke="#2B2F36" stroke-width="1.4"/><text x="730" y="780" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">30% of runs</text><text x="630" y="690" font-size="16" fill="#7C8591" font-weight="600" text-anchor="middle">or</text><text x="880" y="640" font-size="20" fill="#2B2F36" font-weight="600" text-anchor="start">Why not just “it was somewhere, we just didn’t know”?</text><text x="880" y="682" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">No — the possibilities interfere: like waves, they add up or cancel out.</text><text x="880" y="714" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">A position fixed all along could not do that, and this interference</text><text x="880" y="746" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">is exactly what a quantum computer uses.</text></svg>