<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1270" width="1600" height="1270" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="1270" fill="#FFFFFF"/><rect x="30" y="30" width="760" height="220" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">원자·이온·회로: 큐비트끼리 직접 밀고 당김</text><circle cx="230" cy="150" r="30" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><circle cx="560" cy="150" r="30" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><polyline points="262.0,142 268.4,158 274.8,142 281.2,158 287.6,142 294.0,158 300.4,142 306.8,158 313.2,142 319.6,158 326.0,142 332.4,158 338.8,142 345.2,158 351.6,142 358.0,158 364.4,142 370.8,158 377.2,142 383.6,158 390.0,142 396.4,158 402.8,142 409.2,158 415.6,142 422.0,158 428.4,142 434.8,158 441.2,142 447.6,158 454.0,142 460.4,158 466.8,142 473.2,158 479.6,142 486.0,158 492.4,142 498.8,158 505.2,142 511.6,158 518.0,142 524.4,158" fill="none" stroke="#D9822B" stroke-width="2.2"/><text x="395" y="120" font-size="16" fill="#D9822B" font-weight="600" text-anchor="middle">전기·자기 힘</text><text x="410" y="218" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">→ 두 큐비트 게이트가 매번 일어남 (정확도 약 99.9%)</text><rect x="810" y="30" width="760" height="220" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="832" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">광자: 두 빛줄기는 서로를 그냥 통과함</text><line x1="900" y1="205" x2="1180" y2="95" stroke="#D9822B" stroke-width="2.6"/><line x1="900" y1="95" x2="1180" y2="205" stroke="#2F6DB5" stroke-width="2.6"/><ellipse cx="960" cy="181" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1120" cy="181" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="1210" y="128" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="start">전하가 없음</text><text x="1210" y="156" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">→ 광자끼리 힘이 작용하지 않음</text><text x="1210" y="184" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">→ 직접 엮을 방법이 없음</text><g transform="translate(0 -50)"><rect x="30" y="330" width="1540" height="470" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="366" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">요령 1 — 반거울에서의 간섭: 똑같은 두 광자는 항상 같은 쪽으로 함께 나감</text><rect x="166" y="526" width="68" height="68" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="166" y1="594" x2="234" y2="526" stroke="#2F6DB5" stroke-width="3"/><line x1="50" y1="560" x2="166" y2="560" stroke="#D9822B" stroke-width="2.4"/><ellipse cx="90" cy="560" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="90" y="548" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">A</text><line x1="200" y1="710" x2="200" y2="594" stroke="#2F6DB5" stroke-width="2.4"/><ellipse cx="200" cy="670" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="222" y="676" font-size="14" fill="#2F6DB5" font-weight="700" text-anchor="start">B</text><text x="200" y="460" font-size="16" fill="#2B2F36" font-weight="600" text-anchor="middle">반거울(빔 분할기):</text><text x="200" y="482" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">광자마다 통과 또는 반사, 50 대 50</text><text x="200" y="750" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">A와 B가 같은 순간에 도착</text><rect x="534" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="534" y1="586" x2="586" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="480" y1="560" x2="560" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="560" y1="640" x2="560" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="472" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="560" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="560" y1="555" x2="638" y2="555" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="565" y1="560" x2="565" y2="482" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="560" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">둘 다 통과</text><text x="560" y="710" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">+½</text><rect x="774" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="774" y1="586" x2="826" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="720" y1="560" x2="800" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="800" y1="640" x2="800" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="712" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="800" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="795" y1="560" x2="795" y2="482" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="800" y1="565" x2="878" y2="565" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="800" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">둘 다 반사</text><text x="800" y="710" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">−½</text><text x="680.0" y="424" font-size="16" fill="#2B2F36" font-weight="600" text-anchor="middle">양쪽에 하나씩 — 두 가지 경로</text><text x="680.0" y="745" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">+½ − ½ = 0  →  상쇄: 절대 안 일어남</text><text x="680.0" y="768" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(아예 존재하지 않는 경우 — 얽힘을 따질 대상이 아님)</text><line x1="945" y1="430" x2="945" y2="760" stroke="#D5DBE3" stroke-width="1.2"/><rect x="1054" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="1054" y1="586" x2="1106" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="1000" y1="560" x2="1080" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="1080" y1="640" x2="1080" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="992" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="1080" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="1080" y1="555" x2="1158" y2="555" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="1080" y1="565" x2="1158" y2="565" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="1080" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">둘 다 오른쪽으로</text><text x="1080" y="710" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="middle">50%</text><rect x="1294" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="1294" y1="586" x2="1346" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="1240" y1="560" x2="1320" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="1320" y1="640" x2="1320" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="1232" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="1320" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="1315" y1="560" x2="1315" y2="482" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="1325" y1="560" x2="1325" y2="482" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="1320" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">둘 다 위로</text><text x="1320" y="710" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="middle">50%</text><rect x="960" y="448" width="480" height="290" rx="14" fill="none" stroke="#5B9A6B" stroke-width="2.2" stroke-dasharray="8 5"/><text x="1200.0" y="424" font-size="16" fill="#5B9A6B" font-weight="700" text-anchor="middle">얽힌 상태: 측정 전에는 이 두 경우가 겹친 하나의 상태</text><text x="1200.0" y="468" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">‘둘 다 오른쪽’ + ‘둘 다 위’가 동시에</text><text x="1200.0" y="760" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">측정하면 둘 중 하나로 결정(50/50) → 그 뒤엔 얽힘 풀림</text><text x="800" y="788" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">아무것도 광자를 밀지 않았는데 경로가 서로 묶였어요 — 간섭 덕분이에요 (반사될 때 파동의 박자가 바뀌어 − 부호가 생김).</text><rect x="30" y="830" width="1540" height="460" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="866" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">요령 2 — 일부 광자를 측정하고 나머지를 남김: 일부 확률로만 성공하는 ‘융합’ 게이트</text><text x="80" y="965" font-size="16" fill="#D9822B" font-weight="700" text-anchor="start">쌍 1</text><ellipse cx="190" cy="960" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="190" y="948" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">1a</text><ellipse cx="250" cy="960" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="250" y="948" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">1b</text><path d="M202 960 L238 960" stroke="#D9822B" stroke-width="1.4" stroke-dasharray="3 3"/><text x="80" y="1105" font-size="16" fill="#2F6DB5" font-weight="700" text-anchor="start">쌍 2</text><ellipse cx="190" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="190" y="1088" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">2b</text><ellipse cx="250" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="250" y="1088" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">2a</text><path d="M202 1100 L238 1100" stroke="#2F6DB5" stroke-width="1.4" stroke-dasharray="3 3"/><text x="220" y="1142" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">쌍마다 만들 때부터 얽혀 있음,</text><text x="220" y="1162" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">두 쌍끼리는 아직 무관</text><path d="M262 960 C380 960 420 1030 486 1030" fill="none" stroke="#D9822B" stroke-width="2.2"/><path d="M262 1100 C380 1100 520 1170 520 1064" fill="none" stroke="#2F6DB5" stroke-width="2.2"/><rect x="486" y="996" width="68" height="68" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="486" y1="1064" x2="554" y2="996" stroke="#2F6DB5" stroke-width="3"/><line x1="550" y1="1030" x2="616" y2="1030" stroke="#2B2F36" stroke-width="2"/><line x1="520" y1="1000" x2="520" y2="954" stroke="#2B2F36" stroke-width="2"/><path d="M630 1016 A14 14 0 0 1 630 1044 Z" fill="#2B2F36"/><path d="M506 940 A14 14 0 0 1 534 940 Z" fill="#2B2F36" transform="rotate(-90 520 940)"/><text x="560" y="1092" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="start">1b·2a:</text><text x="560" y="1112" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">검출되며 사라짐</text><text x="656" y="1036" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">검출기 1</text><text x="546" y="944" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">검출기 2</text><rect x="820" y="910" width="340" height="230" rx="10" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="840" y="942" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="start">검출기마다 한 번씩 딸깍</text><text x="840" y="966" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="start">→ 성공 (약 절반의 확률)</text><ellipse cx="910" cy="1040" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="910" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="890" y="1045" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="end">1a</text><text x="890" y="1105" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="end">2b</text><path d="M924 1044 C970 1060 970 1082 924 1096" fill="none" stroke="#5B9A6B" stroke-width="2.4"/><text x="980" y="1048" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">남은 1a와 2b는</text><text x="980" y="1070" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">만난 적이 없지만</text><text x="980" y="1092" font-size="15" fill="#5B9A6B" font-weight="700" text-anchor="start">이제 얽힘</text><text x="980" y="1114" font-size="15" fill="#5B9A6B" font-weight="700" text-anchor="start">= 게이트 완료</text><rect x="1200" y="910" width="340" height="230" rx="10" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.6"/><text x="1220" y="942" font-size="17" fill="#D9822B" font-weight="700" text-anchor="start">한 검출기에서 두 번 딸깍</text><text x="1220" y="966" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="start">→ 실패 (약 절반의 확률)</text><text x="1220" y="1040" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">하지만 실패한 걸 바로 알 수 있어서,</text><text x="1220" y="1064" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">준비해 둔 새 광자로</text><text x="1220" y="1088" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">다시 시도</text><line x1="710" y1="1010" x2="808" y2="1010" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><path d="M710 1050 Q730 1158 820 1158 L1210 1158 Q1236 1158 1240 1146" fill="none" stroke="#2B2F36" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/><line x1="60" y1="1188" x2="1540" y2="1188" stroke="#D5DBE3" stroke-width="1.2"/><text x="60" y="1240" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="start">실제로는 쌍 대신 광자 여러 개짜리 작은 덩어리를 융합해요.</text><text x="60" y="1268" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">덩어리마다 하나씩 사라지고, 나머지 전부가 하나의 큰 그물로 이어져요.</text><line x1="812" y1="1250" x2="824" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="848" y1="1250" x2="860" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="884" y1="1250" x2="896" y2="1250" stroke="#5B9A6B" stroke-width="2"/><ellipse cx="800" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="836" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="872" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="908" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="944" cy="1250" rx="12" ry="7" fill="none" stroke="#D5DBE3" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M937 1243 L951 1257 M951 1243 L937 1257" stroke="#C0392B" stroke-width="1.8"/><text x="872" y="1284" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">광자 5개</text><text x="990" y="1256" font-size="20" fill="#2B2F36" font-weight="600" text-anchor="middle">+</text><line x1="1078" y1="1250" x2="1090" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1114" y1="1250" x2="1126" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1150" y1="1250" x2="1162" y2="1250" stroke="#5B9A6B" stroke-width="2"/><ellipse cx="1030" cy="1250" rx="12" ry="7" fill="none" stroke="#D5DBE3" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M1023 1243 L1037 1257 M1037 1243 L1023 1257" stroke="#C0392B" stroke-width="1.8"/><ellipse cx="1066" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1102" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1138" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width=