<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="1600" height="950" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="950" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="400" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">One reliable logical qubit is built from many noisy physical qubits</text><circle cx="120" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="120" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="120" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="120" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="120" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="120" cy="260" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="120" cy="290" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="150" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="150" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="180" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="210" cy="110" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="210" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="210" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="210" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="210" cy="230" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="210" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="210" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="240" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="170" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="270" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><text x="210" y="340.0" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">49 physical qubits</text><text x="210" y="363.4" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">each fails ~1 in 1,000 operations</text><path d="M280 164 L334 98" fill="none" stroke="#D9822B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="338" y="102" font-size="15" fill="#D9822B" font-weight="600" text-anchor="start">error</text><line x1="400" y1="200" x2="540" y2="200" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><text x="470" y="184" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">error-correcting code</text><circle cx="640" cy="200" r="54" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2.4"/><text x="640" y="330.0" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">1 logical qubit</text><text x="640" y="353.4" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">fails far less often;</text><text x="640" y="376.8" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">bigger code → fewer failures</text><line x1="770" y1="90" x2="770" y2="400" stroke="#D5DBE3" stroke-width="1.5"/><text x="800" y="108" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">physical qubits → logical qubits</text><circle cx="800" cy="162" r="5" fill="#2F6DB5"/><text x="818" y="168" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="start">Google Willow (2024)</text><text x="1130" y="168" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">101 physical → 1 logical</text><circle cx="800" cy="228" r="5" fill="#2F6DB5"/><text x="818" y="234" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="start">Harvard / MIT / QuEra (2025)</text><text x="1130" y="234" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">448 physical → 96 logical</text><circle cx="800" cy="294" r="5" fill="#2F6DB5"/><text x="818" y="300" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="start">Quantinuum Helios (2026)</text><text x="1130" y="300" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">98 physical → 48 logical</text><circle cx="800" cy="360" r="5" fill="#2F6DB5"/><text x="818" y="366" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="start">IBM Starling (2029, target)</text><text x="1130" y="366" font-size="19" fill="#2F6DB5" font-weight="600" text-anchor="start">→ 200 logical</text><rect x="30" y="460" width="1540" height="460" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="496" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Four ways to build a qubit</text><text x="395.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">Superconducting circuits</text><text x="725.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">Trapped ions</text><text x="1055.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">Neutral atoms</text><text x="1385.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">Photons</text><line x1="70" y1="546" x2="1550" y2="546" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="576" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">the qubit</text><text x="395.0" y="576.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">tiny electrical circuit on a chip</text><text x="725.0" y="570.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">single charged atom in an electric</text><text x="725.0" y="590.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">trap</text><text x="1055.0" y="570.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">single atom held by a laser</text><text x="1055.0" y="590.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">tweezer</text><text x="1385.0" y="570.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">particle of light in a chip</text><text x="1385.0" y="590.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">waveguide</text><line x1="70" y1="608" x2="1550" y2="608" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="638" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">temperature</text><text x="395.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">0.01 K, dilution refrigerator</text><text x="725.0" y="632.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">room-temperature vacuum,</text><text x="725.0" y="652.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">laser-cooled</text><text x="1055.0" y="632.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">room-temperature vacuum,</text><text x="1055.0" y="652.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">laser-cooled</text><text x="1385.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">room temperature (cold detectors)</text><line x1="70" y1="670" x2="1550" y2="670" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="700" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">physical → logical</text><text x="395.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">105 → 1 (Willow)</text><text x="725.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">98 → 48 (Helios)</text><text x="1055.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">448 → 96 (Harvard/QuEra)</text><text x="1385.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">12 → 0 (Aurora)</text><line x1="70" y1="732" x2="1550" y2="732" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="762" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">strength</text><text x="395.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">fast gates; best error-correction</text><text x="395.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">results</text><text x="725.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">most accurate gates (99.92%);</text><text x="725.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">any-to-any links</text><text x="1055.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">huge arrays; many logical qubits</text><text x="1055.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">per atom</text><text x="1385.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">networkable; made in ordinary chip</text><text x="1385.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">fabs</text><line x1="70" y1="794" x2="1550" y2="794" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="824" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">weakness</text><text x="395.0" y="818.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">near absolute zero; short-lived</text><text x="395.0" y="838.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">qubits</text><text x="725.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">slow; hard to scale past hundreds</text><text x="1055.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">slower gates; atoms get lost</text><text x="1385.0" y="818.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">photons get lost; no logical qubit</text><text x="1385.0" y="838.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">yet</text><line x1="70" y1="856" x2="1550" y2="856" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="886" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">who</text><text x="395.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">Google, IBM</text><text x="725.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">Quantinuum, IonQ</text><text x="1055.0" y="880.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">Harvard/QuEra, Atom Computing,</text><text x="1055.0" y="900.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">Pasqal</text><text x="1385.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">PsiQuantum, Xanadu</text></svg>