 r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="170" r="10" fill="#D9822B" stroke="#D9822B" stroke-width="1.4"/><circle cx="270" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="270" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="110" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="140" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="170" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="200" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="230" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="260" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><circle cx="300" cy="290" r="10" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.4"/><text x="210" y="340.0" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">물리 큐비트 49개</text><text x="210" y="363.4" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">연산 1,000번에 1번꼴로 틀림</text><circle cx="318" cy="302" r="6" fill="#D9822B"/><text x="332" y="307" font-size="15" fill="#D9822B" font-weight="400" text-anchor="start">오류</text><line x1="400" y1="200" x2="540" y2="200" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><text x="470" y="184" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">오류 정정 부호</text><circle cx="640" cy="200" r="54" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2.4"/><text x="640" y="330.0" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">논리 큐비트 1개</text><text x="640" y="353.4" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">훨씬 드물게 틀리고,</text><text x="640" y="376.8" font-size="18" fill="#2B2F36" font-weight="400" text-anchor="middle">부호를 키울수록 더 드물어짐</text><line x1="770" y1="90" x2="770" y2="400" stroke="#D5DBE3" stroke-width="1.5"/><circle cx="800" cy="106" r="5" fill="#2F6DB5"/><text x="818" y="112" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="start">구글 Willow, 2024년 12월</text><text x="818" y="138" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">초전도 큐비트 101개 → 논리 큐비트 1개. 부호를 한 단계 키울 때마다 오류 절반</text><circle cx="800" cy="180" r="5" fill="#2F6DB5"/><text x="818" y="186" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="start">하버드·MIT·QuEra, 2025년</text><text x="818" y="212" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">중성원자 448개 → 논리 큐비트 최대 96개(고효율 부호)</text><circle cx="800" cy="254" r="5" fill="#2F6DB5"/><text x="818" y="260" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="start">퀀티넘 Helios, 2026년 3월</text><text x="818" y="286" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">이온 98개 → 오류 정정 논리 큐비트 48개(오류 검출 94개)</text><circle cx="800" cy="328" r="5" fill="#2F6DB5"/><text x="818" y="334" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="start">IBM 로드맵, 2029년(목표)</text><text x="818" y="360" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">‘스탈링’: 논리 큐비트 200개로 연산 1억 번</text><rect x="30" y="460" width="1540" height="460" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="496" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">큐비트를 만드는 네 가지 방법</text><text x="395.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">초전도 회로</text><text x="725.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">이온 트랩</text><text x="1055.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">중성원자</text><text x="1385.0" y="520" font-size="19" fill="#2B2F36" font-weight="600" text-anchor="middle">빛(광자)</text><line x1="70" y1="546" x2="1550" y2="546" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="576" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">큐비트</text><text x="395.0" y="576.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">칩 위의 작은 전기 회로</text><text x="725.0" y="576.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">전기장에 가둔 원자 이온 하나</text><text x="1055.0" y="576.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">레이저 집게로 잡은 원자 하나</text><text x="1385.0" y="576.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">칩 도파로 속 빛 입자</text><line x1="70" y1="608" x2="1550" y2="608" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="638" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">온도</text><text x="395.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">0.01 K, 희석 냉동기</text><text x="725.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">상온 진공, 레이저 냉각</text><text x="1055.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">상온 진공, 레이저 냉각</text><text x="1385.0" y="638.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">상온(검출기만 냉각)</text><line x1="70" y1="670" x2="1550" y2="670" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="700" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">현재 최대</text><text x="395.0" y="694.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">칩당 100~150개(Willow</text><text x="395.0" y="714.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">105개)</text><text x="725.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">98개(Helios)</text><text x="1055.0" y="694.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">6,100개 포획, 3,000개로</text><text x="1055.0" y="714.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">2시간 연속 구동</text><text x="1385.0" y="700.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">12개(Aurora, 2025)</text><line x1="70" y1="732" x2="1550" y2="732" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="762" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">강점</text><text x="395.0" y="762.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">빠른 게이트, 오류 정정 성과 최고</text><text x="725.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">가장 정확한 게이트(99.92%),</text><text x="725.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">임의 연결</text><text x="1055.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">대규모 배열, 원자당 논리 큐비트</text><text x="1055.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">많음</text><text x="1385.0" y="756.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">네트워크 연결 쉬움, 일반 반도체</text><text x="1385.0" y="776.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">공장 제작</text><line x1="70" y1="794" x2="1550" y2="794" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="824" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">약점</text><text x="395.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">극저온 필요, 큐비트 수명 짧음</text><text x="725.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">느림, 수백 개 이상 확장 어려움</text><text x="1055.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">게이트 느림, 원자 손실</text><text x="1385.0" y="824.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">광자 손실, 논리 큐비트 아직 없음</text><line x1="70" y1="856" x2="1550" y2="856" stroke="#D5DBE3" stroke-width="1.2"/><text x="70" y="886" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">누가</text><text x="395.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">구글, IBM</text><text x="725.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">퀀티넘, IonQ</text><text x="1055.0" y="880.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">하버드/QuEra, Atom</text><text x="1055.0" y="900.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">Computing, Pasqal</text><text x="1385.0" y="886.0" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="middle">PsiQuantum, Xanadu</text></svg>