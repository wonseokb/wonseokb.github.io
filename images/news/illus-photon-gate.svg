<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1270" width="1600" height="1270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="1270" fill="#FFFFFF"/><rect x="30" y="30" width="760" height="220" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Atoms, ions, circuits: qubits push on each other</text><circle cx="230" cy="150" r="30" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><circle cx="560" cy="150" r="30" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="2"/><polyline points="262.0,142 268.4,158 274.8,142 281.2,158 287.6,142 294.0,158 300.4,142 306.8,158 313.2,142 319.6,158 326.0,142 332.4,158 338.8,142 345.2,158 351.6,142 358.0,158 364.4,142 370.8,158 377.2,142 383.6,158 390.0,142 396.4,158 402.8,142 409.2,158 415.6,142 422.0,158 428.4,142 434.8,158 441.2,142 447.6,158 454.0,142 460.4,158 466.8,142 473.2,158 479.6,142 486.0,158 492.4,142 498.8,158 505.2,142 511.6,158 518.0,142 524.4,158" fill="none" stroke="#D9822B" stroke-width="2.2"/><text x="395" y="120" font-size="16" fill="#D9822B" font-weight="600" text-anchor="middle">electric / magnetic force</text><text x="410" y="218" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">→ a two-qubit gate happens every time (and is right ~99.9% of the time)</text><rect x="810" y="30" width="760" height="220" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="832" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Photons: two beams pass straight through each other</text><line x1="900" y1="205" x2="1180" y2="95" stroke="#D9822B" stroke-width="2.6"/><line x1="900" y1="95" x2="1180" y2="205" stroke="#2F6DB5" stroke-width="2.6"/><ellipse cx="960" cy="181" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1120" cy="181" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="1210" y="128" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="start">no electric charge</text><text x="1210" y="156" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">→ no force between photons</text><text x="1210" y="184" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">→ no direct way to link them</text><g transform="translate(0 -50)"><rect x="30" y="330" width="1540" height="470" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="366" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Trick 1 — interference at a half-mirror: two identical photons always leave together</text><rect x="166" y="526" width="68" height="68" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="166" y1="594" x2="234" y2="526" stroke="#2F6DB5" stroke-width="3"/><line x1="50" y1="560" x2="166" y2="560" stroke="#D9822B" stroke-width="2.4"/><ellipse cx="90" cy="560" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="90" y="548" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">A</text><line x1="200" y1="710" x2="200" y2="594" stroke="#2F6DB5" stroke-width="2.4"/><ellipse cx="200" cy="670" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="222" y="676" font-size="14" fill="#2F6DB5" font-weight="700" text-anchor="start">B</text><text x="200" y="460" font-size="16" fill="#2B2F36" font-weight="600" text-anchor="middle">half-mirror (beam splitter):</text><text x="200" y="482" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">each photon goes through or bounces, 50/50</text><text x="200" y="750" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">A and B arrive at the same moment</text><rect x="534" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="534" y1="586" x2="586" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="480" y1="560" x2="560" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="560" y1="640" x2="560" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="472" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="560" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="560" y1="555" x2="638" y2="555" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="565" y1="560" x2="565" y2="482" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="560" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">both go through</text><text x="560" y="710" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">+½</text><rect x="774" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="774" y1="586" x2="826" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="720" y1="560" x2="800" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="800" y1="640" x2="800" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="712" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="800" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="795" y1="560" x2="795" y2="482" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="800" y1="565" x2="878" y2="565" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="800" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">both bounce</text><text x="800" y="710" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">−½</text><text x="680.0" y="424" font-size="16" fill="#2B2F36" font-weight="600" text-anchor="middle">one photon on each side — two ways</text><text x="680.0" y="745" font-size="17" fill="#C0392B" font-weight="700" text-anchor="middle">+½ − ½ = 0  →  cancel: never happens</text><text x="680.0" y="768" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(not a state at all — so neither entangled nor not)</text><line x1="945" y1="430" x2="945" y2="760" stroke="#D5DBE3" stroke-width="1.2"/><rect x="1054" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="1054" y1="586" x2="1106" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="1000" y1="560" x2="1080" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="1080" y1="640" x2="1080" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="992" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="1080" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="1080" y1="555" x2="1158" y2="555" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="1080" y1="565" x2="1158" y2="565" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="1080" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">both leave right</text><text x="1080" y="710" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="middle">50%</text><rect x="1294" y="534" width="52" height="52" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="1294" y1="586" x2="1346" y2="534" stroke="#2F6DB5" stroke-width="3"/><line x1="1240" y1="560" x2="1320" y2="560" stroke="#D9822B" stroke-width="2.2"/><line x1="1320" y1="640" x2="1320" y2="560" stroke="#2F6DB5" stroke-width="2.2"/><text x="1232" y="565" font-size="15" fill="#D9822B" font-weight="700" text-anchor="end">A</text><text x="1320" y="660" font-size="15" fill="#2F6DB5" font-weight="700" text-anchor="middle">B</text><line x1="1315" y1="560" x2="1315" y2="482" stroke="#D9822B" stroke-width="2.6" marker-end="url(#aro)"/><line x1="1325" y1="560" x2="1325" y2="482" stroke="#2F6DB5" stroke-width="2.6" marker-end="url(#arb)"/><text x="1320" y="688" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">both leave up</text><text x="1320" y="710" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="middle">50%</text><rect x="960" y="448" width="480" height="290" rx="14" fill="none" stroke="#5B9A6B" stroke-width="2.2" stroke-dasharray="8 5"/><text x="1200.0" y="424" font-size="16" fill="#5B9A6B" font-weight="700" text-anchor="middle">ENTANGLED: before measuring, these two are one state</text><text x="1200.0" y="468" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">“both right” + “both up” at once</text><text x="1200.0" y="760" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">measure → one of the two (50/50); after that, not entangled</text><text x="800" y="788" font-size="16" fill="#7C8591" font-weight="400" text-anchor="middle">Nothing pushed the photons, yet their paths became linked — interference did it (a bounce shifts the wave’s timing, which gives the minus sign).</text><rect x="30" y="830" width="1540" height="460" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="866" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">Trick 2 — measure some photons, keep the rest: a ‘fusion’ gate that works only part of the time</text><text x="80" y="965" font-size="16" fill="#D9822B" font-weight="700" text-anchor="start">pair 1</text><ellipse cx="190" cy="960" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="190" y="948" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">1a</text><ellipse cx="250" cy="960" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><text x="250" y="948" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">1b</text><path d="M202 960 L238 960" stroke="#D9822B" stroke-width="1.4" stroke-dasharray="3 3"/><text x="80" y="1105" font-size="16" fill="#2F6DB5" font-weight="700" text-anchor="start">pair 2</text><ellipse cx="190" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="190" y="1088" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">2b</text><ellipse cx="250" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="250" y="1088" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="middle">2a</text><path d="M202 1100 L238 1100" stroke="#2F6DB5" stroke-width="1.4" stroke-dasharray="3 3"/><text x="220" y="1142" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">each pair is born entangled;</text><text x="220" y="1162" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">the two pairs are not yet linked</text><path d="M262 960 C380 960 420 1030 486 1030" fill="none" stroke="#D9822B" stroke-width="2.2"/><path d="M262 1100 C380 1100 520 1170 520 1064" fill="none" stroke="#2F6DB5" stroke-width="2.2"/><rect x="486" y="996" width="68" height="68" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><line x1="486" y1="1064" x2="554" y2="996" stroke="#2F6DB5" stroke-width="3"/><line x1="550" y1="1030" x2="616" y2="1030" stroke="#2B2F36" stroke-width="2"/><line x1="520" y1="1000" x2="520" y2="954" stroke="#2B2F36" stroke-width="2"/><path d="M630 1016 A14 14 0 0 1 630 1044 Z" fill="#2B2F36"/><path d="M506 940 A14 14 0 0 1 534 940 Z" fill="#2B2F36" transform="rotate(-90 520 940)"/><text x="560" y="1092" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="start">1b, 2a:</text><text x="560" y="1112" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">detected, used up</text><text x="656" y="1036" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">detector 1</text><text x="546" y="944" font-size="14" fill="#7C8591" font-weight="400" text-anchor="start">detector 2</text><rect x="820" y="910" width="340" height="230" rx="10" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.6"/><text x="840" y="942" font-size="17" fill="#5B9A6B" font-weight="700" text-anchor="start">one click in each detector</text><text x="840" y="966" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="start">→ success (about half the time)</text><ellipse cx="910" cy="1040" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="910" cy="1100" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="890" y="1045" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="end">1a</text><text x="890" y="1105" font-size="14" fill="#2B2F36" font-weight="700" text-anchor="end">2b</text><path d="M924 1044 C970 1060 970 1082 924 1096" fill="none" stroke="#5B9A6B" stroke-width="2.4"/><text x="980" y="1048" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">1a and 2b, left behind,</text><text x="980" y="1070" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">never met, but are</text><text x="980" y="1092" font-size="15" fill="#5B9A6B" font-weight="700" text-anchor="start">now entangled</text><text x="980" y="1114" font-size="15" fill="#5B9A6B" font-weight="700" text-anchor="start">= gate done</text><rect x="1200" y="910" width="340" height="230" rx="10" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.6"/><text x="1220" y="942" font-size="17" fill="#D9822B" font-weight="700" text-anchor="start">two clicks in one detector</text><text x="1220" y="966" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="start">→ failure (about half the time)</text><text x="1220" y="1040" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">but you know it failed,</text><text x="1220" y="1064" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">so you try again with</text><text x="1220" y="1088" font-size="15" fill="#2B2F36" font-weight="400" text-anchor="start">fresh photons</text><line x1="710" y1="1010" x2="808" y2="1010" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><path d="M710 1050 Q730 1158 820 1158 L1210 1158 Q1236 1158 1240 1146" fill="none" stroke="#2B2F36" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/><line x1="60" y1="1188" x2="1540" y2="1188" stroke="#D5DBE3" stroke-width="1.2"/><text x="60" y="1240" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="start">In practice, small clusters of photons are fused, not pairs:</text><text x="60" y="1268" font-size="16" fill="#7C8591" font-weight="400" text-anchor="start">one photon from each is used up, and all the rest join one bigger web.</text><line x1="812" y1="1250" x2="824" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="848" y1="1250" x2="860" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="884" y1="1250" x2="896" y2="1250" stroke="#5B9A6B" stroke-width="2"/><ellipse cx="800" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="836" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="872" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="908" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="944" cy="1250" rx="12" ry="7" fill="none" stroke="#D5DBE3" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M937 1243 L951 1257 M951 1243 L937 1257" stroke="#C0392B" stroke-width="1.8"/><text x="872" y="1284" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">5 photons</text><text x="990" y="1256" font-size="20" fill="#2B2F36" font-weight="600" text-anchor="middle">+</text><line x1="1078" y1="1250" x2="1090" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1114" y1="1250" x2="1126" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1150" y1="1250" x2="1162" y2="1250" stroke="#5B9A6B" stroke-width="2"/><ellipse cx="1030" cy="1250" rx="12" ry="7" fill="none" stroke="#D5DBE3" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M1023 1243 L1037 1257 M1037 1243 L1023 1257" stroke="#C0392B" stroke-width="1.8"/><ellipse cx="1066" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1102" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1138" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1174" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="1102" y="1284" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">5 photons</text><line x1="1200" y1="1250" x2="1260" y2="1250" stroke="#2B2F36" stroke-width="1.8" marker-end="url(#ar)"/><text x="1230" y="1236" font-size="14" fill="#2B2F36" font-weight="600" text-anchor="middle">fuse</text><line x1="1298" y1="1250" x2="1308" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1332" y1="1250" x2="1342" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1366" y1="1250" x2="1376" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1400" y1="1250" x2="1410" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1434" y1="1250" x2="1444" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1468" y1="1250" x2="1478" y2="1250" stroke="#5B9A6B" stroke-width="2"/><line x1="1502" y1="1250" x2="1512" y2="1250" stroke="#5B9A6B" stroke-width="2"/><ellipse cx="1286" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1320" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1354" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1388" cy="1250" rx="12" ry="7" fill="#FFE27A" stroke="#D9A23C" stroke-width="1.6"/><ellipse cx="1422" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1456" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1490" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><ellipse cx="1524" cy="1250" rx="12" ry="7" fill="#CFE0F5" stroke="#2F6DB5" stroke-width="1.6"/><text x="1405" y="1284" font-size="14" fill="#5B9A6B" font-weight="600" text-anchor="middle">8 photons, one web</text></g></svg>