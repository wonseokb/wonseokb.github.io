<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="1000" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="560" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">AI 로봇은 지금 어디까지 왔나 (2026년 9월)</text><text x="380" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">시범</text><text x="490" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">제한적 운영</text><text x="600" y="90" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">대규모 운영</text><text x="80" y="137" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">물류센터 로봇</text><rect x="330" y="118" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="118" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="118" width="100" height="24" rx="4" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.2"/><text x="680" y="137" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">아마존: 로봇 100만 대 이상, 촉각 집기 로봇(Vulcan) 확대 중</text><line x1="80" y1="168" x2="1540" y2="168" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="211" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">농업용 분무기</text><rect x="330" y="192" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="192" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="192" width="100" height="24" rx="4" fill="#DFEDE2" stroke="#5B9A6B" stroke-width="1.2"/><text x="680" y="211" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">디어 See &amp; Spray: 2025년 500만 에이커 이상, 제초제 약 절반</text><line x1="80" y1="242" x2="1540" y2="242" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="285" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">로보택시</text><rect x="330" y="266" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="266" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="266" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="285" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">웨이모 주 50만 회 유료 운행, 미국 10개+ 도시. 바이두 27개 도시. 테슬라 수십 대</text><line x1="80" y1="316" x2="1540" y2="316" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="359" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">로봇 개</text><rect x="330" y="340" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="340" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="340" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="359" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">Spot 약 2,000대, 경찰 폭발물 처리반 60곳 이상, 점검·대치 상황</text><line x1="80" y1="390" x2="1540" y2="390" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="433" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">군사용 드론</text><rect x="330" y="414" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="414" width="100" height="24" rx="4" fill="#DCE8F6" stroke="#2F6DB5" stroke-width="1.2"/><rect x="550" y="414" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="433" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">우크라이나: AI가 마지막 접근 조종, 표적 선택은 여전히 사람</text><line x1="80" y1="464" x2="1540" y2="464" stroke="#D5DBE3" stroke-width="1"/><text x="80" y="507" font-size="21" fill="#2B2F36" font-weight="600" text-anchor="start">휴머노이드</text><rect x="330" y="488" width="100" height="24" rx="4" fill="#FBE8D3" stroke="#D9822B" stroke-width="1.2"/><rect x="440" y="488" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><rect x="550" y="488" width="100" height="24" rx="4" fill="#EEF1F5" stroke="#D5DBE3" stroke-width="1.2"/><text x="680" y="507" font-size="19" fill="#7C8591" font-weight="400" text-anchor="start">Figure 03이 BMW 한 작업장에서 부품 분류, 충전당 4~5시간. 옵티머스는 아직 실사용 전</text><line x1="80" y1="538" x2="1540" y2="538" stroke="#D5DBE3" stroke-width="1"/><rect x="30" y="620" width="755" height="350" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="656" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">이미 잘하는 것</text><rect x="815" y="620" width="755" height="350" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="837" y="656" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">아직 많이 부족한 것</text><circle cx="72" cy="721" r="6" fill="#5B9A6B"/><text x="92" y="728" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">정해진 공간의 반복 작업(선반, 상자, 작물 줄)</text><circle cx="72" cy="787" r="6" fill="#5B9A6B"/><text x="92" y="794" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">지도가 갖춰진 도심 도로 주행(원격 도우미 대기)</text><circle cx="72" cy="853" r="6" fill="#5B9A6B"/><text x="92" y="860" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">보는 것: 잡초, 소포, 표적, 장애물</text><circle cx="72" cy="919" r="6" fill="#5B9A6B"/><text x="92" y="926" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">사람이 가기 어려운 곳의 순찰·점검</text><circle cx="857" cy="721" r="6" fill="#D9822B"/><text x="877" y="728" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">손: 처음 보는 물건, 얇거나 부드러운 부품</text><circle cx="857" cy="787" r="6" fill="#D9822B"/><text x="877" y="794" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">내구성: 몇 시간뿐인 배터리, 잘 망가지는 손목·팔</text><circle cx="857" cy="853" r="6" fill="#D9822B"/><text x="877" y="860" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">드문 상황: 스쿨버스, 막힌 길, 궂은 날씨</text><circle cx="857" cy="919" r="6" fill="#D9822B"/><text x="877" y="926" font-size="23" fill="#2B2F36" font-weight="400" text-anchor="start">판단과 책임: 누가 결정하고 누가 책임지나</text></svg>