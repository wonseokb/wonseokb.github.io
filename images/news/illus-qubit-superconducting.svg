nes = fixed wiring on the chip</text><text x="1100" y="450" font-size="20" fill="#D9822B" font-weight="600" text-anchor="start">Fragile</text><text x="1100" y="480" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">loses its state in ~0.1 ms;</text><text x="1100" y="506" font-size="17" fill="#7C8591" font-weight="400" text-anchor="start">needs deep cold and lots of wiring</text></svg>