<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Helvetica Neue, Helvetica, Arial, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2B2F36"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F6DB5"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/></marker></defs><rect width="1600" height="800" fill="#FFFFFF"/><rect x="30" y="30" width="1540" height="320" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="66" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">얽힘: 두 입자가 하나의 상태를 나눠 가진다. 아무리 멀리 떨어져도</text><rect x="760" y="195" width="80" height="60" rx="6" fill="#EEF1F5" stroke="#7C8591" stroke-width="1.4"/><text x="800" y="231" font-size="15" fill="#2B2F36" font-weight="600" text-anchor="middle">생성</text><text x="800" y="285" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">쌍을 만듦</text><line x1="750" y1="225" x2="260" y2="225" stroke="#7C8591" stroke-width="1.6" marker-end="url(#ar)"/><line x1="850" y1="225" x2="1340" y2="225" stroke="#7C8591" stroke-width="1.6" marker-end="url(#ar)"/><rect x="506" y="209" width="28" height="32" fill="#FFFFFF"/><path d="M508 239 L518 211 M522 239 L532 211" stroke="#7C8591" stroke-width="1.6"/><rect x="1066" y="209" width="28" height="32" fill="#FFFFFF"/><path d="M1068 239 L1078 211 M1082 239 L1092 211" stroke="#7C8591" stroke-width="1.6"/><text x="520" y="269" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">수 광년…</text><text x="1080" y="269" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">…수 광년</text><circle cx="220" cy="225" r="30" fill="#FFFFFF" stroke="#5B9A6B" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="210" y1="241" x2="210" y2="209" stroke="#2F6DB5" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arb)"/><line x1="230" y1="209" x2="230" y2="241" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#aro)"/><circle cx="1380" cy="225" r="30" fill="#FFFFFF" stroke="#5B9A6B" stroke-width="1.8" stroke-dasharray="4 3"/><line x1="1370" y1="241" x2="1370" y2="209" stroke="#2F6DB5" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arb)"/><line x1="1390" y1="209" x2="1390" y2="241" stroke="#D9822B" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#aro)"/><text x="220" y="285" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="middle">입자 A</text><text x="1380" y="285" font-size="17" fill="#2B2F36" font-weight="600" text-anchor="middle">입자 B</text><text x="220" y="307" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(지구의 실험실)</text><text x="1380" y="307" font-size="14" fill="#7C8591" font-weight="400" text-anchor="middle">(은하 반대편 실험실)</text><path d="M220 185 C420 115 1180 115 1380 185" fill="none" stroke="#5B9A6B" stroke-width="2" stroke-dasharray="6 4"/><text x="800" y="113" font-size="17" fill="#5B9A6B" font-weight="600" text-anchor="middle">얽힘: 아직 둘 다 제 값(↑ 또는 ↓)이 없고, ‘서로 반대로 나온다’는 관계만 있음</text><rect x="30" y="370" width="700" height="400" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="52" y="406" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">쌍마다 측정, 여러 번 반복</text><text x="150" y="461" font-size="15" fill="#7C8591" font-weight="600" text-anchor="end">쌍</text><text x="150" y="521" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="end">A</text><text x="150" y="601" font-size="18" fill="#2B2F36" font-weight="600" text-anchor="end">B</text><text x="230" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">1</text><circle cx="230" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="230" y1="529" x2="230" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="230" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="230" y1="581" x2="230" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="290" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">2</text><circle cx="290" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="290" y1="501" x2="290" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="290" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="290" y1="609" x2="290" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="350" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">3</text><circle cx="350" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="350" y1="501" x2="350" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="350" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="350" y1="609" x2="350" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="410" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">4</text><circle cx="410" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="410" y1="529" x2="410" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="410" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="410" y1="581" x2="410" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="470" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">5</text><circle cx="470" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="470" y1="501" x2="470" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="470" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="470" y1="609" x2="470" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="530" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">6</text><circle cx="530" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="530" y1="529" x2="530" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="530" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="530" y1="581" x2="530" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="590" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">7</text><circle cx="590" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="590" y1="529" x2="590" y2="501" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><circle cx="590" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="590" y1="581" x2="590" y2="609" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><text x="650" y="461" font-size="15" fill="#7C8591" font-weight="400" text-anchor="middle">8</text><circle cx="650" cy="515" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="650" y1="501" x2="650" y2="529" stroke="#D9822B" stroke-width="3" marker-end="url(#aro)"/><circle cx="650" cy="595" r="22" fill="#FFFFFF" stroke="#2B2F36" stroke-width="1.6"/><line x1="650" y1="609" x2="650" y2="581" stroke="#2F6DB5" stroke-width="3" marker-end="url(#arb)"/><text x="60" y="676" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="start">A만 보면: 동전처럼 무작위 (50 : 50)</text><text x="60" y="706" font-size="16" fill="#2B2F36" font-weight="400" text-anchor="start">B만 보면: 동전처럼 무작위 (50 : 50)</text><text x="60" y="742" font-size="17" fill="#5B9A6B" font-weight="600" text-anchor="start">둘을 맞대 보면: 매번 빠짐없이 반대</text><rect x="750" y="370" width="820" height="400" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1.5"/><text x="772" y="406" font-size="24" fill="#2B2F36" font-weight="400" text-anchor="start">뜻하는 것과 뜻하지 않는 것</text><text x="786" y="452" font-size="24" fill="#5B9A6B" font-weight="600" text-anchor="middle">✓</text><text x="812" y="452" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">A를 측정하는 순간 B의 결과도 반대로 정해져요.</text><text x="812" y="480" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">거리가 아무리 멀어도, 시간차 없이.</text><text x="786" y="534" font-size="24" fill="#C0392B" font-weight="600" text-anchor="middle">✗</text><text x="812" y="534" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">하지만 둘 사이로 무언가 날아가는 건 아니에요. B만 보면</text><text x="812" y="562" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">여전히 무작위라 신호를 보낼 수 없고, 빛보다 빠른 통신도 불가능.</text><text x="786" y="616" font-size="24" fill="#C0392B" font-weight="600" text-anchor="middle">✗</text><text x="812" y="616" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">측정 뒤에 A를 돌리거나 건드려도 B는 그대로예요.</text><text x="812" y="644" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">연결은 두 쪽 결과 목록을 맞대 볼 때만 드러나요.</text><text x="786" y="698" font-size="24" fill="#5B9A6B" font-weight="600" text-anchor="middle">✓</text><text x="812" y="698" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">장갑 한 켤레를 두 상자에 나눠 담듯 미리 정해진 게 아니에요.</text><text x="812" y="726" font-size="19" fill="#2B2F36" font-weight="400" text-anchor="start">벨 실험이 이를 입증했어요 (2022 노벨 물리학상).</text></svg>